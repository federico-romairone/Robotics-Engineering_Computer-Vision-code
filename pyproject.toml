[project]
name = "robotics-engineering-computer-vision-code"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "federico-romairone", email = "federico.romairone.cs@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "opencv-python>=5.0.0.93",
    "scipy>=1.18.1",
]

[project.scripts]
robotics-engineering-computer-vision-code = "robotics_engineering_computer_vision_code:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "nbstripout>=0.9.1",
]

[tool.uv]
package = false
